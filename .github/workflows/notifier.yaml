name: Notifier

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  notifyTelegram:
    runs-on: ubuntu-latest
    steps:
      - name: send custom message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            New update is coming, please download latest version of iRoyal Apps
