plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def envProperties = new Properties()
def envFile = rootProject.file('../.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        envProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    throw new GradleException("versionCode not found. Define flutter.versionCode in the local.properties file.")
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    throw new GradleException("versionName not found. Define flutter.versionName in the local.properties file.")
}

def devKeystoreProperties = new Properties()
def devKeystoreFile = rootProject.file('key-dev.properties')
if (devKeystoreFile.exists()) {
    devKeystoreProperties.load(new FileInputStream(devKeystoreFile))
}

def prodKeystoreProperties = new Properties()
def prodKeystoreFile = rootProject.file('key-prod.properties')
if (prodKeystoreFile.exists()) {
    prodKeystoreProperties.load(new FileInputStream(prodKeystoreFile))
}

android {
    signingConfigs {
         release {
                keyAlias prodKeystoreProperties['keyAlias']
                keyPassword prodKeystoreProperties['keyPassword']
                storeFile prodKeystoreProperties['storeFile'] ? file(prodKeystoreProperties['storeFile']) : null
                storePassword prodKeystoreProperties['storePassword']
            }
         debug {
                keyAlias devKeystoreProperties['keyAlias']
                keyPassword devKeystoreProperties['keyPassword']
                storeFile devKeystoreProperties['storeFile'] ? file(devKeystoreProperties['storeFile']) : null
                storePassword devKeystoreProperties['storePassword']
            }
    }

    flavorDimensions "flavor-dimension"
     productFlavors {
        prod {
            dimension "flavor-dimension"
            resValue "string", "app_name", "MyRoyal"
            applicationIdSuffix ""
            signingConfig signingConfigs.release
        }
        dev {
            dimension "flavor-dimension"
            resValue "string", "app_name", "MyRoyal Dev"
            applicationIdSuffix ".dev"
            signingConfig signingConfigs.debug
        }
    }

    namespace "com.myroyal"
    compileSdkVersion 36
    ndkVersion "27.1.12297006"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    

    defaultConfig {
        manifestPlaceholders = [
            GEO_API_KEY: envProperties.getProperty('GEO_API_KEY', '')
                .replaceAll('"', '')
                .trim()
        ]
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.myroyal"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 25
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }



    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    constraints {
        implementation("androidx.core:core-ktx:1.13.1") {
            because("core-ktx 1.15.0+ requires AGP 8.9+")
        }
        implementation("androidx.core:core:1.13.1") {
            because("core 1.15.0+ requires AGP 8.9+")
        }
    }
}
