dependencies:
  android_id: ^0.4.0
  another_stepper: ^1.2.2
  cached_network_image: ^3.4.1
  calendar_date_picker2: ^2.0.1
  camera: ^0.11.2
  carousel_slider: ^5.0.0
  collection: ^1.18.0
  connectivity_plus: ^6.1.0
