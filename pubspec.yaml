name: iroyal
version: 1.0.0+12
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  another_stepper: ^1.2.2
  cached_network_image: ^3.3.1
  calendar_date_picker2: ^1.1.7
  carousel_slider: ^5.0.0
  collection: ^1.18.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  device_info_plus: ^11.1.1
  dio: ^5.4.2+1
  dio_request_inspector: ^3.1.6
  dog: ^1.4.0
  easy_date_timeline: ^1.1.3
  encrypt: ^5.0.3
  equatable: ^2.0.5
  firebase_analytics: ^11.3.4
  firebase_core: ^3.7.0
  firebase_messaging: ^15.1.4
  firebase_remote_config: ^5.1.4
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_cached_pdfview: ^0.4.2
  flutter_downloader: ^1.11.8
  flutter_jailbreak_detection: ^1.10.0
  flutter_launcher_icons: ^0.14.1
  flutter_local_notifications: ^17.2.4
  flutter_screenutil: ^5.9.0
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.10+1
  geolocator: ^13.0.1
  get: ^4.6.6
  google_maps_flutter: ^2.6.0
  hive_flutter: ^1.1.0
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  internet_connection_checker: ^1.0.0+1
  intl: ^0.19.0
  local_auth: ^2.2.0
  lottie: ^3.1.2
  open_file_plus: ^3.4.1+1
  package_info_plus: ^8.1.1
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  pie_chart: ^5.4.0
  readmore: ^3.0.0
  search_highlight_text: ^1.0.0+2
  share_plus: ^10.1.2
  shimmer: ^3.0.0
  tuple: ^2.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - shorebird.yaml

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
  uses-material-design: true
