  intl: ^0.20.2
  latlong2: ^0.9.1
  local_auth: ^2.2.0
  lottie: ^3.1.2
  media_store_plus: ^0.1.3
  mobile_scanner: ^7.0.1
  open_filex: ^4.7.0
  package_info_plus: ^8.1.1
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.4.0
  readmore: ^3.0.0
  search_highlight_text: ^1.0.0+2
  share_plus: ^10.1.2
  shimmer: ^3.0.0
  signature: ^6.3.0
  tuple: ^2.0.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - shorebird.yaml

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
  uses-material-design: true
