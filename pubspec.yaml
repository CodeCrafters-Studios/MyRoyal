  dio_request_inspector: ^3.1.6
  dog: ^1.4.0
  dotted_border: ^3.1.0
  encrypt: ^5.0.3
  equatable: ^2.0.5
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.0.1
  firebase_remote_config: ^6.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_cached_pdfview: ^0.4.2
  flutter_downloader: ^1.11.8
  flutter_launcher_icons: ^0.14.1
  flutter_local_notifications: ^19.4.1
  flutter_map: ^8.2.2
  flutter_screenutil: ^5.9.0
  flutter_slidable: ^4.0.1
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.10+1
  geolocator: ^14.0.2
  get: ^4.6.6
